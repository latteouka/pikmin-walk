<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pikmin Walker — 花朵巡航</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            border: 'hsl(217.2 32.6% 17.5%)',
            input: 'hsl(217.2 32.6% 17.5%)',
            ring: 'hsl(212.7 26.8% 83.9%)',
            background: 'hsl(222.2 84% 4.9%)',
            foreground: 'hsl(210 40% 98%)',
            primary: 'hsl(210 40% 98%)',
            'primary-foreground': 'hsl(222.2 47.4% 11.2%)',
            muted: 'hsl(217.2 32.6% 17.5%)',
            'muted-foreground': 'hsl(215 20.2% 65.1%)',
            accent: 'hsl(217.2 32.6% 17.5%)',
            'accent-foreground': 'hsl(210 40% 98%)',
            destructive: 'hsl(0 62.8% 30.6%)',
            'destructive-foreground': 'hsl(210 40% 98%)',
            card: 'hsl(222.2 84% 4.9%)',
            'card-foreground': 'hsl(210 40% 98%)',
          },
        },
      },
    };
  </script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(30,41,59,0.92);
      --panel-solid: #1e293b;
      --border: #475569;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --flower: #ec4899;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; }
    body { color: var(--text); overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
    #map { flex: 1 1 auto; min-height: 0; width: 100%; }
    .leaflet-container { font-family: inherit; }

    #panel {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
      min-width: 460px;
      max-width: 540px;
      max-height: calc(100vh - 96px);   /* leave nav (48) + breathing room */
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    /* Narrow viewports: panel becomes a docked bottom sheet */
    @media (max-width: 600px) {
      #panel {
        bottom: 0;
        left: 0;
        right: 0;
        transform: none;
        min-width: 0;
        max-width: none;
        border-radius: 16px 16px 0 0;
        padding: 16px;
        max-height: 70vh;
      }
    }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      cursor: grab; user-select: none; touch-action: none;
    }
    .panel-header.dragging { cursor: grabbing; }
    .panel-title { font-size: 16px; font-weight: 600; }
    .panel-title .dot { color: var(--flower); }
    #deviceStatus {
      font-size: 11px; padding: 4px 10px; border-radius: 20px;
      background: var(--panel-solid); border: 1px solid var(--border);
    }
    #deviceStatus.ok { border-color: var(--success); color: var(--success); }

    .input-block { display: flex; flex-direction: column; gap: 6px; }
    .input-block label {
      font-size: 11px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    #flowersText {
      width: 100%; min-height: 120px; resize: vertical;
      font-family: ui-monospace, monospace; font-size: 12px;
      padding: 8px 10px; background: var(--panel-solid);
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--text);
    }
    #flowersText:focus { outline: none; border-color: var(--flower); }
    .parse-row { display: flex; gap: 8px; align-items: center; }
    .parse-row .parse-info { flex: 1; font-size: 11px; color: var(--muted); }
    .parse-row button {
      padding: 6px 12px; font-size: 12px; font-family: inherit;
      background: var(--panel-solid); border: 1px solid var(--border);
      border-radius: 6px; color: var(--muted); cursor: pointer;
    }
    .parse-row button:hover { color: var(--text); }

    .control-row { display: flex; align-items: center; gap: 12px; }
    .control-row label {
      font-size: 12px; color: var(--muted); min-width: 60px; text-align: right;
    }
    .control-row input[type="range"] { flex: 1; accent-color: var(--accent); }
    .control-row .value {
      font-size: 13px; font-weight: 600; min-width: 72px;
      font-family: ui-monospace, monospace;
    }

    .start-from-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--muted);
    }
    .start-from-row input {
      width: 64px; padding: 4px 8px;
      background: var(--panel-solid); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text);
      font-family: ui-monospace, monospace; font-size: 13px;
    }
    .start-from-row input:focus { outline: none; border-color: var(--flower); }

    .loop-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--muted);
    }
    .loop-row input[type="checkbox"] { accent-color: var(--flower); cursor: pointer; }
    .loop-row label { cursor: pointer; user-select: none; }

    .dwell-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      font-size: 12px; color: var(--muted);
    }
    .dwell-row .field { display: flex; flex-direction: column; gap: 4px; }
    .dwell-row .field-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .dwell-row input[type="number"] {
      padding: 6px 8px; background: var(--panel-solid);
      border: 1px solid var(--border); border-radius: 6px; color: var(--text);
      font-family: ui-monospace, monospace; font-size: 13px;
    }
    .dwell-row input[type="number"]:focus { outline: none; border-color: var(--flower); }

    .mode-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0;
      background: var(--panel-solid); border: 1px solid var(--border);
      border-radius: 8px; padding: 3px;
    }
    .mode-row label {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 6px 8px; border-radius: 6px;
      font-size: 12px; color: var(--muted);
      cursor: pointer; user-select: none;
      transition: background 0.15s, color 0.15s;
    }
    .mode-row input[type="radio"] { display: none; }
    .mode-row input[type="radio"]:checked + span {
      color: var(--text); font-weight: 600;
    }
    .mode-row label:has(input:checked) {
      background: var(--flower);
    }
    .mode-row label:has(input:checked) span { color: white; }

    .preview-info {
      padding: 10px 14px; background: var(--panel-solid);
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 12px; color: var(--muted); text-align: center;
      min-height: 40px; display: flex; align-items: center; justify-content: center; gap: 16px;
    }
    .preview-info .pi-num { font-size: 18px; font-weight: 700; color: var(--text); font-family: ui-monospace, monospace; }
    .preview-info .pi-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
    .preview-info.loading { color: var(--accent); }
    .preview-info.error { color: var(--danger); border-color: var(--danger); }

    .stats-row {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
    }
    .stat {
      text-align: center; padding: 8px;
      background: var(--panel-solid); border-radius: 8px; border: 1px solid var(--border);
    }
    .stat .num { font-size: 18px; font-weight: 700; font-family: ui-monospace, monospace; }
    .stat .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

    .btn-row { display: flex; gap: 8px; }
    .btn-row button {
      flex: 1; padding: 12px; font-size: 14px; font-weight: 600;
      font-family: inherit; border: 1px solid var(--border); border-radius: 10px;
      cursor: pointer; color: var(--text); background: var(--panel-solid);
    }
    .btn-row button:hover:not(:disabled) { background: var(--border); }
    .btn-row button.primary { background: var(--accent); border-color: var(--accent); }
    .btn-row button.primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-row button.danger { background: var(--danger); border-color: var(--danger); }
    .btn-row button:disabled { opacity: 0.4; cursor: not-allowed; }

    #statusLine { font-size: 11px; color: var(--muted); text-align: center; }
    #statusLine.running { color: var(--accent); }
    #statusLine.error { color: var(--danger); }

    .layer-control {
      position: absolute; top: 58px; right: 10px; z-index: 1000;
      display: flex; gap: 4px; background: var(--panel);
      padding: 4px; border-radius: 8px; backdrop-filter: blur(8px);
    }
    .layer-control button {
      padding: 6px 10px; font-size: 11px; font-weight: 500;
      background: transparent; border: 1px solid var(--border);
      border-radius: 5px; color: var(--muted); cursor: pointer;
    }
    .layer-control button.active { background: var(--accent); border-color: var(--accent); color: white; }
    .back-link {
      position: absolute; top: 58px; left: 10px; z-index: 1000;
      padding: 6px 14px; font-size: 12px; font-weight: 500;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; color: var(--muted); text-decoration: none;
      backdrop-filter: blur(8px);
    }
    .back-link:hover { color: var(--text); }
  </style>
</head>

<script>
  // Highlight the current nav link based on current pathname
  (function() {
    const path = location.pathname;
    const map = { '/': 'home', '/flower-cruise': 'flower', '/walk': 'walk' };
    const active = map[path] || '';
    document.querySelectorAll('#nav-links a').forEach(a => {
      if (a.dataset.page === active) {
        a.classList.remove('text-muted-foreground');
        a.classList.add('bg-accent', 'text-foreground');
      }
    });
  })();
</script>
<script>
//
// ---- Modal (shadcn-style replacement for prompt/confirm) ----
//
const Modal = {
  _show({ type, title, description, defaultValue = '', placeholder = '',
          confirmText = '確定', cancelText = '取消', danger = false }) {
    return new Promise((resolve) => {
      const root = document.createElement('div');
      root.className = 'fixed inset-0 z-[1200] flex items-center justify-center';

      const backdrop = document.createElement('div');
      backdrop.className = 'absolute inset-0 bg-black/60 backdrop-blur-sm';

      const card = document.createElement('div');
      card.style.cssText = 'position:relative;width:100%;max-width:420px;margin:0 16px;'
        + 'background:var(--panel);color:var(--text);'
        + 'border:1px solid var(--border);border-radius:12px;'
        + 'box-shadow:0 20px 60px rgba(0,0,0,0.55);padding:20px 22px;'
        + 'font-family:inherit;';

      const titleEl = document.createElement('h3');
      titleEl.style.cssText = 'margin:0 0 6px 0;font-size:15px;font-weight:600;letter-spacing:-0.01em;';
      titleEl.textContent = title || '';
      card.append(titleEl);

      if (description) {
        const desc = document.createElement('p');
        desc.style.cssText = 'margin:0 0 14px 0;font-size:13px;color:var(--muted);'
          + 'line-height:1.5;white-space:pre-wrap;';
        desc.textContent = description;
        card.append(desc);
      } else {
        card.style.paddingTop = '20px';
      }

      let input = null;
      if (type === 'input') {
        input = document.createElement('input');
        input.type = 'text';
        input.style.cssText = 'width:100%;height:36px;padding:6px 10px;margin-top:4px;'
          + 'font-size:14px;font-family:inherit;color:var(--text);'
          + 'background:var(--panel-2, var(--panel-solid, #334155));border:1px solid var(--border);'
          + 'border-radius:8px;outline:none;transition:border-color 0.15s;';
        input.addEventListener('focus', () => { input.style.borderColor = 'var(--accent)'; });
        input.addEventListener('blur', () => { input.style.borderColor = 'var(--border)'; });
        if (defaultValue) input.value = defaultValue;
        if (placeholder) input.placeholder = placeholder;
        card.append(input);
      }

      const actions = document.createElement('div');
      actions.style.cssText = 'display:flex;justify-content:flex-end;gap:8px;margin-top:18px;';

      const cancelBtn = document.createElement('button');
      cancelBtn.style.cssText = 'width:auto;padding:8px 16px;font-size:13px;font-weight:500;'
        + 'color:var(--text);background:transparent;border:1px solid var(--border);'
        + 'border-radius:8px;cursor:pointer;transition:background 0.15s;';
      cancelBtn.addEventListener('mouseenter', () => { cancelBtn.style.background = 'var(--panel-2, var(--panel-solid, #334155))'; });
      cancelBtn.addEventListener('mouseleave', () => { cancelBtn.style.background = 'transparent'; });
      cancelBtn.textContent = cancelText;

      const okBtn = document.createElement('button');
      okBtn.style.cssText = 'width:auto;padding:8px 18px;font-size:13px;font-weight:500;'
        + 'color:white;border-radius:8px;cursor:pointer;transition:background 0.15s;'
        + (danger
            ? 'background:var(--danger);border:1px solid var(--danger);'
            : 'background:var(--accent);border:1px solid var(--accent);');
      okBtn.addEventListener('mouseenter', () => {
        okBtn.style.background = danger ? 'var(--danger-hover, #dc2626)' : 'var(--accent-hover, #2563eb)';
      });
      okBtn.addEventListener('mouseleave', () => {
        okBtn.style.background = danger ? 'var(--danger)' : 'var(--accent)';
      });
      okBtn.textContent = confirmText;

      actions.append(cancelBtn, okBtn);
      card.append(actions);

      root.append(backdrop, card);
      document.body.append(root);

      const cancelValue = type === 'input' ? null : false;

      const cleanup = (result) => {
        document.removeEventListener('keydown', onKey);
        root.remove();
        resolve(result);
      };

      const onKey = (e) => {
        if (e.key === 'Escape') { e.preventDefault(); cleanup(cancelValue); }
        else if (e.key === 'Enter' && !e.isComposing && (type === 'confirm' || document.activeElement === input)) {
          e.preventDefault();
          cleanup(type === 'input' ? input.value.trim() : true);
        }
      };
      document.addEventListener('keydown', onKey);

      backdrop.addEventListener('click', () => cleanup(cancelValue));
      cancelBtn.addEventListener('click', () => cleanup(cancelValue));
      okBtn.addEventListener('click', () => cleanup(type === 'input' ? input.value.trim() : true));

      setTimeout(() => {
        if (input) { input.focus(); input.select(); }
        else { okBtn.focus(); }
      }, 0);
    });
  },
  input(opts) { return this._show({ type: 'input', ...opts }); },
  confirm(opts) { return this._show({ type: 'confirm', ...opts }); },
};
</script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', { zoomControl: false }).setView([0, 0], 2);
L.control.zoom({ position: 'topright' }).addTo(map);

const tileLayers = {
  google: L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 21 }),
  satellite: L.tileLayer('https://mt1.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', { maxZoom: 21 }),
  osm: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }),
};
let currentTile = tileLayers.google;
currentTile.addTo(map);
document.getElementById('layerControl').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-layer]');
  if (!btn) return;
  const key = btn.dataset.layer;
  if (!tileLayers[key] || tileLayers[key] === currentTile) return;
  map.removeLayer(currentTile);
  currentTile = tileLayers[key];
  currentTile.addTo(map);
  document.querySelectorAll('#layerControl button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
});

let deviceMarker = null;
const routeLine = L.polyline([], { color: '#ec4899', weight: 3, opacity: 0.7, dashArray: '6, 4' }).addTo(map);
const trailLine = L.polyline([], { color: '#3b82f6', weight: 4, opacity: 0.9 }).addTo(map);
// 多段軌跡：teleport（飛行）時開新段，段與段間不連線，避免橫跨地圖的直線。
let trailSegs = [[]];
const flowerMarkers = L.layerGroup().addTo(map);

function updateDevice(lat, lon, pan = false) {
  const ll = [lat, lon];
  if (!deviceMarker) {
    deviceMarker = L.circleMarker(ll, {
      radius: 9, color: '#fff', weight: 2, fillColor: '#3b82f6', fillOpacity: 1,
    }).addTo(map);
  } else deviceMarker.setLatLng(ll);
  if (pan) map.setView(ll, Math.max(map.getZoom(), 14));
}

const $flowersText = document.getElementById('flowersText');
const $parseInfo = document.getElementById('parseInfo');
const $btnClear = document.getElementById('btnClear');
const $speed = document.getElementById('speed');
const $speedVal = document.getElementById('speedVal');
const $preview = document.getElementById('previewInfo');
const $btnPreview = document.getElementById('btnPreview');
const $btnInOrder = document.getElementById('btnInOrder');
const $btnStart = document.getElementById('btnStart');
const $btnStop = document.getElementById('btnStop');
const $btnPause = document.getElementById('btnPause');
const $btnGotoFirst = document.getElementById('btnGotoFirst');
const $gotoFirstRow = document.getElementById('gotoFirstRow');
// 種花開始前：先把裝置瞬移到第一朵花、地圖也飛過去，確認位置對不對。
$btnGotoFirst.addEventListener('click', () => {
  const f = parsedFlowers[0];
  if (!f) { setStatus('還沒解析到花', 'error'); return; }
  ws.send(JSON.stringify({ type: 'teleport', lat: f[0], lon: f[1] }));
  map.setView([f[0], f[1]], Math.max(map.getZoom(), 16));
  setStatus('已瞬移到第一朵花', '');
});
const $status = document.getElementById('statusLine');
const $deviceStatus = document.getElementById('deviceStatus');
const $startFromRow = document.getElementById('startFromRow');
const $startFrom = document.getElementById('startFrom');
const $totalFlowers = document.getElementById('totalFlowers');
const $loopChk = document.getElementById('loopChk');
const $dwellEach = document.getElementById('dwellEach');
const $dwellRow = document.getElementById('dwellRow');
const $circleRadius = document.getElementById('circleRadius');
const $radiusRow = document.getElementById('radiusRow');
const $radiusVal = document.getElementById('radiusVal');
$circleRadius.addEventListener('input', () => { $radiusVal.textContent = $circleRadius.value + ' m'; });
const $modeRadios = document.querySelectorAll('input[name="cruiseMode"]');

function getCruiseMode() {
  for (const r of $modeRadios) if (r.checked) return r.value;
  return 'harvest';
}
let parsedFlowers = [];      // [[lat, lon], ...] from textarea
let previewedRoute = null;   // { ordered, distance_km, count } from server
let startFromIndex = 0;      // 0-indexed; 0 = start from the first TSP flower

// 種花模式只解析出 1 朵花時 = 原地繞單朵花子模式（自動偵測，無新增開關）
function isSingleFlowerPlant() {
  return getCruiseMode() === 'plant' && parsedFlowers.length === 1;
}
// 多朵種花才顯示 dwell 欄位；單朵原地繞花不適用
const $speedRow = document.getElementById('speedRow');
const $loopRow = document.querySelector('.loop-row');
function syncModeUI() {
  const isPlant = getCruiseMode() === 'plant';
  // 種花/採花都已調校到最佳值、不開放調整 → 半徑/速度/停留滑桿全藏
  $dwellRow.style.display = 'none';
  $radiusRow.style.display = 'none';
  $speedRow.style.display = 'none';
  // 兩種模式都顯示「飛到第一朵花看看」預覽按鈕
  $gotoFirstRow.style.display = 'flex';
  // 種花永遠循環（payload 寫死 loop:true）→ 隱藏 loop 開關；採花保留開關、預設不勾
  $loopRow.style.display = isPlant ? 'none' : 'flex';
}
$modeRadios.forEach(r => r.addEventListener('change', () => {
  syncModeUI();
  applySingleFlowerPlant();
}));
syncModeUI();

// Great-circle distance helpers — used to recompute slice distance when the
// user picks a non-default start. Mirrors pikmin_walk.haversine_m.
function haversineM(a, b) {
  const R = 6371000;
  const lat1 = a[0] * Math.PI / 180, lat2 = b[0] * Math.PI / 180;
  const dLat = (b[0] - a[0]) * Math.PI / 180;
  const dLon = (b[1] - a[1]) * Math.PI / 180;
  const x = Math.sin(dLat/2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon/2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function pathDistM(points) {
  let s = 0;
  for (let i = 0; i < points.length - 1; i++) s += haversineM(points[i], points[i + 1]);
  return s;
}

function parseFlowers(text) {
  const nums = text.match(/-?\d+\.?\d*/g) || [];
  const pairs = [];
  for (let i = 0; i + 1 < nums.length; i += 2) {
    const lat = parseFloat(nums[i]);
    const lon = parseFloat(nums[i + 1]);
    if (!isNaN(lat) && !isNaN(lon) &&
        lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) {
      pairs.push([lat, lon]);
    }
  }
  return pairs;
}

function updateParseInfo() {
  parsedFlowers = parseFlowers($flowersText.value);
  if (parsedFlowers.length === 0) {
    $parseInfo.textContent = '尚未解析';
    $btnPreview.disabled = true;
    $btnInOrder.disabled = true;
    $btnStart.disabled = true;
    clearOrbitCircle();
    return;
  }
  $parseInfo.textContent = `已解析 ${parsedFlowers.length} 朵花`;
  $btnPreview.disabled = parsedFlowers.length < 2;
  $btnInOrder.disabled = parsedFlowers.length < 2;
  // Render markers immediately so user sees what was parsed
  renderFlowerMarkers(parsedFlowers, false);
  if (parsedFlowers.length > 0) {
    map.fitBounds(L.latLngBounds(parsedFlowers).pad(0.2));
  }
  // Reset preview state since input changed
  previewedRoute = null;
  startFromIndex = 0;
  routeLine.setLatLngs([]);
  $startFromRow.style.display = 'none';
  $btnStart.disabled = true;
  $preview.textContent = '輸入已變更，按「預覽路線」重新規劃';
  $preview.className = 'preview-info';
  // 種花模式 + 剛好 1 朵 → 自動進入原地繞花；其餘情況維持上面的重置
  syncModeUI();
  applySingleFlowerPlant();
}

function renderFlowerMarkers(flowers, ordered, skipBefore = 0) {
  flowerMarkers.clearLayers();
  flowers.forEach((f, i) => {
    const skipped = ordered && i < skipBefore;
    const m = L.circleMarker([f[0], f[1]], {
      radius: 6, color: '#fff', weight: 2,
      fillColor: skipped ? '#64748b' : '#ec4899',
      fillOpacity: skipped ? 0.45 : 1,
    }).addTo(flowerMarkers);
    if (ordered) {
      m.bindTooltip(String(i + 1), {
        permanent: true, direction: 'top', className: 'flower-num',
        offset: [0, -4],
      });
    } else {
      m.bindTooltip(`花 #${i + 1}`);
    }
  });
}

// Re-render polyline + markers + stats for the currently chosen startFromIndex.
function redrawForStart() {
  if (!previewedRoute) return;
  const slice = previewedRoute.ordered.slice(startFromIndex);
  routeLine.setLatLngs(slice);
  renderFlowerMarkers(previewedRoute.ordered, true, startFromIndex);
  updateLapTime();
  // Need ≥2 points to walk; disable Start otherwise.
  $btnStart.disabled = slice.length < 2;
}

let orbitCircle = null;  // 70m 繞圈示意圈（單朵原地繞花）
function showOrbitCircle(flower) {
  clearOrbitCircle();
  orbitCircle = L.circle(flower, {
    radius: 70, color: '#ec4899', weight: 2,
    fillColor: '#ec4899', fillOpacity: 0.12, dashArray: '4, 4',
  }).addTo(map);
}
function clearOrbitCircle() {
  if (orbitCircle) { map.removeLayer(orbitCircle); orbitCircle = null; }
}

// 依目前模式 / 已解析花朵數，套用「原地繞單朵花」的 UI 狀態。
// 0 或 ≥2 朵時只負責清掉繞圈示意圈，不碰其他按鈕狀態。
function applySingleFlowerPlant() {
  clearOrbitCircle();
  if (parsedFlowers.length !== 1) return;
  if (isSingleFlowerPlant()) {
    showOrbitCircle(parsedFlowers[0]);
    $btnStart.disabled = false;
    $preview.textContent = '🔁 原地繞花 · 70m 圈 · ~4.5 km/h 步行 — 按「開始」無限繞圈';
    $preview.className = 'preview-info';
  } else {
    // 1 朵但模式是採花 / 快速採花
    $btnStart.disabled = true;
    $preview.textContent = '採花模式至少需要 2 朵花';
    $preview.className = 'preview-info';
  }
}

$flowersText.addEventListener('input', updateParseInfo);
$btnClear.addEventListener('click', () => {
  $flowersText.value = '';
  updateParseInfo();
});

$speed.addEventListener('input', () => {
  $speedVal.textContent = `${$speed.value} km/h`;
  updateLapTime();
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'set_speed', speed_kmh: parseInt($speed.value) }));
  }
});

$startFrom.addEventListener('input', () => {
  if (!previewedRoute) return;
  let v = parseInt($startFrom.value);
  if (isNaN(v)) return;
  // Clamp to [1, count - 1] so the slice always has ≥ 2 flowers
  v = Math.max(1, Math.min(previewedRoute.count - 1, v));
  startFromIndex = v - 1;
  redrawForStart();
});

function updateLapTime() {
  if (!previewedRoute) return;
  const slice = previewedRoute.ordered.slice(startFromIndex);
  const km = pathDistM(slice) / 1000;
  const mins = km / parseInt($speed.value) * 60;
  $preview.replaceChildren();
  addPreviewStat(slice.length + ' 朵', '剩餘');
  addPreviewStat(km.toFixed(2) + ' km', '距離');
  addPreviewStat(mins.toFixed(1) + ' min', '時間');
}

function addPreviewStat(num, label) {
  const d = document.createElement('div');
  const n = document.createElement('div'); n.className = 'pi-num'; n.textContent = num;
  const l = document.createElement('div'); l.className = 'pi-label'; l.textContent = label;
  d.append(n, l);
  $preview.append(d);
}

function setStatus(text, cls = '') { $status.textContent = text; $status.className = cls; }

let totalDist = 0, startTime = null, statsTimer = null;
function resetStats() {
  totalDist = 0; startTime = null;
  document.getElementById('statDist').textContent = '0.0';
  document.getElementById('statTime').textContent = '0:00';
  if (statsTimer) clearInterval(statsTimer);
}
function startStatsTimer() {
  startTime = Date.now();
  statsTimer = setInterval(() => {
    const s = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById('statTime').textContent =
      `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  }, 1000);
}

$btnInOrder.addEventListener('click', () => {
  if (parsedFlowers.length < 2) {
    setStatus('至少需要 2 朵花', 'error');
    return;
  }
  const ordered = parsedFlowers.slice();
  previewedRoute = {
    ordered,
    distance_km: pathDistM(ordered) / 1000,
    count: ordered.length,
  };
  startFromIndex = 0;
  $startFrom.max = String(Math.max(1, ordered.length - 1));
  $startFrom.value = '1';
  $totalFlowers.textContent = String(ordered.length);
  $startFromRow.style.display = 'flex';
  map.fitBounds(L.latLngBounds(ordered).pad(0.15));
  redrawForStart();
  $preview.textContent = `按輸入順序：${ordered.length} 朵 / ${(pathDistM(ordered)/1000).toFixed(2)} km`;
  $preview.className = 'preview-info';
});

$btnPreview.addEventListener('click', async () => {
  if (parsedFlowers.length < 2) {
    setStatus('至少需要 2 朵花', 'error');
    return;
  }
  $preview.textContent = 'OSRM TSP 規劃中…';
  $preview.className = 'preview-info loading';
  $btnStart.disabled = true;

  try {
    const resp = await fetch('/api/preview-flower-cruise', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ flowers: parsedFlowers }),
    });
    const data = await resp.json();
    if (data.error) {
      $preview.textContent = data.error;
      $preview.className = 'preview-info error';
      return;
    }
    previewedRoute = {
      ordered: data.ordered,
      distance_km: data.distance_km,
      count: data.count,
    };
    // Reset start-from selector for the new preview
    startFromIndex = 0;
    $startFrom.max = String(Math.max(1, data.count - 1));
    $startFrom.value = '1';
    $totalFlowers.textContent = String(data.count);
    $startFromRow.style.display = 'flex';
    // One-shot route: walker stops at the last flower, no return-to-start leg.
    map.fitBounds(L.latLngBounds(data.ordered).pad(0.15));
    redrawForStart();
    $preview.className = 'preview-info';
  } catch (err) {
    $preview.textContent = `Error: ${err.message}`;
    $preview.className = 'preview-info error';
  }
});

let ws;
function connectWS() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onclose = () => { setStatus('斷線，3s 重連', 'error'); setTimeout(connectWS, 3000); };
  ws.onerror = () => setStatus('WS error', 'error');
  ws.onmessage = (ev) => handleMessage(JSON.parse(ev.data));
}

function handleMessage(m) {
  if (window.PikminAdmin && window.PikminAdmin.handle(m)) return;
  switch (m.type) {
    case 'hello':
      if (m.device) {
        $deviceStatus.textContent = m.device.product;
        $deviceStatus.className = 'ok';
      }
      if (m.last_position) {
        updateDevice(m.last_position.lat, m.last_position.lon, true);
        setStatus(`位置: ${m.last_position.lat.toFixed(4)}, ${m.last_position.lon.toFixed(4)}`);
      } else {
        setStatus('先在主控台瞬移到某處');
      }
      break;
    case 'teleported':
      updateDevice(m.lat, m.lon);
      break;
    case 'loop_walk_started':
      $btnStart.disabled = true; $btnStop.disabled = false; $btnPause.disabled = false; $btnPreview.disabled = true; $btnInOrder.disabled = true;
      isPaused = false; $btnPause.textContent = '⏸ 暫停';
      document.getElementById('statsRow').style.display = 'grid';
      resetStats(); startStatsTimer();
      trailSegs = [[]]; trailLine.setLatLngs([]);
      setStatus('巡航中…', 'running');
      break;
    case 'loop_lap':
      // Server emits this once per pass; in one-shot mode there's only ever
      // one pass and no UI to update.
      break;
    case 'tick': {
      updateDevice(m.lat, m.lon);
      if (m.note === 'teleport') {
        trailSegs.push([[m.lat, m.lon]]);          // 飛行：開新段，不與上一朵連線
      } else {
        if (!trailSegs.length) trailSegs.push([]);
        trailSegs[trailSegs.length - 1].push([m.lat, m.lon]);
      }
      // 會跑很久 — 限制總點數避免 polyline 無限增長拖慢瀏覽器（整段整段丟掉最舊的）
      let total = trailSegs.reduce((n, s) => n + s.length, 0);
      while (total > 600 && trailSegs.length > 1) { total -= trailSegs[0].length; trailSegs.shift(); }
      trailLine.setLatLngs(trailSegs);
      totalDist += (m.step_m || 0);
      document.getElementById('statDist').textContent = (totalDist / 1000).toFixed(1);
      break;
    }
    case 'paused':
      isPaused = true;
      $btnPause.textContent = '▶ 繼續';
      setStatus('已暫停', '');
      if (statsTimer) clearInterval(statsTimer);
      break;
    case 'resumed':
      isPaused = false;
      $btnPause.textContent = '⏸ 暫停';
      setStatus('巡航中…', 'running');
      startStatsTimer();
      break;
    case 'stopped':
    case 'done':
      setStatus(m.type === 'done' ? '完成' : '已停止');
      $btnStart.disabled = false; $btnStop.disabled = true; $btnPause.disabled = true; $btnPreview.disabled = parsedFlowers.length < 2; $btnInOrder.disabled = parsedFlowers.length < 2;
      isPaused = false; $btnPause.textContent = '⏸ 暫停';
      if (statsTimer) clearInterval(statsTimer);
      break;
    case 'error':
      setStatus(`Error: ${m.message}`, 'error');
      $btnStart.disabled = false; $btnStop.disabled = true; $btnPreview.disabled = false;
      if (statsTimer) clearInterval(statsTimer);
      break;
  }
}

$btnStart.addEventListener('click', () => {
  // 種花已調校到最佳值，寫死不開放調整：半徑 25m、~14km/h、每朵繞一圈 ~40s。
  const PLANT = { dwell_radius_m: 25, speed_kmh: 14, dwell_each_s: 40 };
  // 原地單朵種花：無限繞圓
  if (isSingleFlowerPlant()) {
    ws.send(JSON.stringify({
      type: 'start_loop_walk',
      route: [parsedFlowers[0]],
      loop: true,
      mode: 'plant',
      speed_kmh: PLANT.speed_kmh,
      dwell_radius_m: PLANT.dwell_radius_m,
    }));
    return;
  }
  if (!previewedRoute) return;
  const mode = getCruiseMode();
  if (mode === 'plant') {
    // 多朵種花：送「完整 route + start_index」。第一圈從 start_index 起跑
    // （前面跳過），第二圈起每圈都跑完整 1→N。飛到每朵 → 繞一圈(~30s) → 飛下一朵 → 循環。
    if (previewedRoute.ordered.length < 2) return;
    ws.send(JSON.stringify({
      type: 'start_loop_walk',
      route: previewedRoute.ordered,
      start_index: startFromIndex,
      loop: true,
      mode: 'plant',
      speed_kmh: PLANT.speed_kmh,
      dwell_each_s: PLANT.dwell_each_s,
      dwell_radius_m: PLANT.dwell_radius_m,
    }));
    return;
  }
  const route = previewedRoute.ordered.slice(startFromIndex);
  if (route.length < 2) return;
  // 採花：跟種花一樣 teleport+orbit，但每朵 15s、循環吃勾選（預設不勾＝跑一輪就停）。
  ws.send(JSON.stringify({
    type: 'start_loop_walk',
    route,
    loop: $loopChk.checked,
    mode: 'harvest',
    speed_kmh: 14,
    dwell_each_s: 15,
    dwell_radius_m: 25,
  }));
});

let isPaused = false;
$btnPause.addEventListener('click', () => {
  if (isPaused) ws.send(JSON.stringify({ type: 'resume' }));
  else ws.send(JSON.stringify({ type: 'pause' }));
});

$btnStop.addEventListener('click', () => ws.send(JSON.stringify({ type: 'stop' })));

connectWS();

// --- Drag the panel from its header ----------------------------------------
// Saves position to localStorage so it survives reloads. Constrained to the
// viewport so it can't be dragged off-screen.
(() => {
  const panel = document.getElementById('panel');
  const header = panel.querySelector('.panel-header');
  const STORAGE_KEY = 'pikminFlowerPanelPos';

  function applyPosition(x, y) {
    panel.style.left = `${x}px`;
    panel.style.top = `${y}px`;
    panel.style.right = 'auto';
    panel.style.bottom = 'auto';
    panel.style.transform = 'none';
  }

  function clamp(x, y) {
    const r = panel.getBoundingClientRect();
    return [
      Math.max(0, Math.min(window.innerWidth - r.width, x)),
      Math.max(0, Math.min(window.innerHeight - r.height, y)),
    ];
  }

  // Restore saved position (if any)
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (saved && typeof saved.x === 'number' && typeof saved.y === 'number') {
      // Defer one frame so the panel has its real bounding rect
      requestAnimationFrame(() => {
        const [x, y] = clamp(saved.x, saved.y);
        applyPosition(x, y);
      });
    }
  } catch {}

  let drag = null;

  header.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    const r = panel.getBoundingClientRect();
    drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    header.classList.add('dragging');
    header.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  header.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const [x, y] = clamp(e.clientX - drag.dx, e.clientY - drag.dy);
    applyPosition(x, y);
  });

  function endDrag(e) {
    if (!drag) return;
    drag = null;
    header.classList.remove('dragging');
    try { header.releasePointerCapture(e.pointerId); } catch {}
    const r = panel.getBoundingClientRect();
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ x: r.left, y: r.top }));
  }
  header.addEventListener('pointerup', endDrag);
  header.addEventListener('pointercancel', endDrag);
})();
</script>
<script>
  // Persist flowersText across reloads
  (function() {
    const ta = document.getElementById('flowersText');
    if (!ta) return;
    const KEY = 'pikmin.flowerCruise.flowersText';
    let t;
    const save = () => { clearTimeout(t); t = setTimeout(() => {
      try { localStorage.setItem(KEY, ta.value); } catch {}
    }, 300); };
    ta.addEventListener('input', save);
    try {
      const v = localStorage.getItem(KEY);
      if (v && !ta.value) {
        ta.value = v;
        // Programmatic value assignment doesn't fire 'input', so listeners
        // (e.g. updateParseInfo populating parsedFlowers) never run on
        // reload. Dispatch one ourselves so derived state stays in sync.
        ta.dispatchEvent(new Event('input', { bubbles: true }));
      }
    } catch {}
  })();
</script>
